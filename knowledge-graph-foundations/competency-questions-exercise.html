<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The CQ Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  :root{
    --paper:#F7F7F2; --grid:rgba(36,86,166,.07); --surface:#FFFFFF; --ink:#20283A;
    --ink-soft:#5A6478; --accent:#2456A6; --accent-ink:#FFFFFF; --line:#DDDDD3;
    --ok:#2F7D4F; --ok-bg:#EAF3ED; --miss:#B23B26; --miss-bg:#F7ECE8;
    --gold:#B98A12; --chip:#EEEEE6; --extract-bg:#F1F3F8; --shadow:0 2px 10px rgba(32,40,58,.08);
  }
  *{box-sizing:border-box}
  body{
    margin:0; color:var(--ink); font:400 17px/1.55 "Source Sans 3",system-ui,sans-serif;
    background:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:28px 28px; min-height:100vh;
  }
  .wrap{max-width:680px;margin:0 auto;padding:28px 20px 80px}
  header{margin-bottom:18px;position:relative;padding-right:106px}
  .kgg-logo{position:absolute;top:0;right:0;height:88px;width:auto;background:#fff;border-radius:12px;padding:4px 8px;box-shadow:var(--shadow)}
  @media (max-width:520px){header{padding-right:76px}.kgg-logo{height:62px}}
  .eyebrow{font:600 12px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  h1{font:800 clamp(32px,7vw,46px)/1.05 "Bricolage Grotesque","Source Sans 3",sans-serif;margin:.3em 0 .15em;text-wrap:balance}
  .sub{color:var(--ink-soft);margin:0}
  .progress{display:flex;gap:5px;margin:20px 0 24px}
  .seg{flex:1;height:7px;border-radius:4px;background:var(--chip);transition:background .3s}
  .seg.ok{background:var(--ok)} .seg.miss{background:var(--miss)} .seg.part{background:var(--gold)} .seg.now{background:var(--accent)}
  .scorebar{display:flex;justify-content:space-between;align-items:baseline;font:600 13px "IBM Plex Mono",monospace;color:var(--ink-soft)}
  .scorebar b{color:var(--gold);font-size:15px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 24px}
  .roundchip{display:inline-block;font:600 11px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:6px 12px;margin-bottom:14px}
  .qtext{font:600 21px/1.4 "Source Sans 3",sans-serif;margin:0 0 18px;text-wrap:balance}
  .cq{
    font:600 19px/1.5 "Source Sans 3",sans-serif;background:var(--extract-bg);
    border-radius:10px;padding:16px 18px;margin:0 0 18px;
  }
  .cq .qm{color:var(--accent);font-family:"Bricolage Grotesque",sans-serif;font-weight:800}
  .answers{display:flex;flex-direction:column;gap:10px}
  .answers.row{flex-direction:row;flex-wrap:wrap}
  button.ans{
    text-align:left;font:400 16.5px/1.4 "Source Sans 3",sans-serif;color:var(--ink);
    background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:13px 16px;
    cursor:pointer;transition:border-color .15s,transform .1s,background .15s;
  }
  .answers.row button.ans{flex:1;min-width:130px;text-align:center;font-weight:600;font-size:18px}
  button.ans:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
  button.ans:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  button.ans:disabled{cursor:default}
  button.ans.right{background:var(--ok-bg);border-color:var(--ok)}
  button.ans.wrong{background:var(--miss-bg);border-color:var(--miss)}
  button.ans.dim{opacity:.45}
  .shapehint{font:400 14px/1.45 "Source Sans 3",sans-serif;color:var(--ink-soft);margin:4px 0 0}
  .frag{background:var(--chip);border-bottom:2px solid var(--accent);border-radius:4px;padding:1px 5px;white-space:nowrap}
  .frag .n{font:600 11px "IBM Plex Mono",monospace;color:var(--accent)}
  .match{display:flex;flex-direction:column;gap:14px}
  .mrow{display:flex;flex-direction:column;gap:8px}
  .mbox{font:600 15px "Source Sans 3",sans-serif}
  .mbox .n{font:600 12px "IBM Plex Mono",monospace;color:var(--accent);margin-right:6px}
  .mchips{display:flex;gap:8px;flex-wrap:wrap}
  button.chip{
    font:400 14.5px "Source Sans 3",sans-serif;color:var(--ink);background:var(--chip);
    border:1.5px solid transparent;border-radius:999px;padding:8px 14px;cursor:pointer;transition:all .15s;
  }
  button.chip:hover:not(:disabled){border-color:var(--accent)}
  button.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  button.chip.sel{background:var(--accent);color:var(--accent-ink)}
  button.chip.right{background:var(--ok-bg);color:var(--ink);border-color:var(--ok)}
  button.chip.wrong{background:var(--miss-bg);color:var(--ink);border-color:var(--miss)}
  button.chip:disabled{cursor:default;opacity:.85}
  .verdict{font:700 18px "Bricolage Grotesque",sans-serif;margin:18px 0 0}
  .verdict.ok{color:var(--ok)} .verdict.miss{color:var(--miss)} .verdict.part{color:var(--gold)}
  .explain{margin:8px 0 0;color:var(--ink-soft)}
  .extract{
    margin-top:14px;background:var(--extract-bg);border-left:3px solid var(--accent);
    border-radius:0 10px 10px 0;padding:14px 16px;font-size:15.5px;color:var(--ink);
  }
  .extract .lab{font:600 11px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:8px}
  .nav{display:flex;justify-content:flex-end;margin-top:20px}
  button.next{
    font:700 16px "Bricolage Grotesque",sans-serif;color:var(--accent-ink);background:var(--accent);
    border:none;border-radius:10px;padding:13px 26px;cursor:pointer;transition:transform .12s;
  }
  button.next:hover{transform:translateY(-1px)}
  button.next:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  .intro h2{font:800 24px "Bricolage Grotesque",sans-serif;margin:0 0 10px}
  .intro p{margin:0 0 14px}
  .checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:14px 0 18px}
  .check{background:var(--extract-bg);border-radius:10px;padding:10px 12px;text-align:center}
  .check b{display:block;font:700 14px "Bricolage Grotesque",sans-serif;color:var(--accent)}
  .check span{font-size:12.5px;color:var(--ink-soft)}
  .shapes{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 4px}
  .shapes span{font:600 12.5px "IBM Plex Mono",monospace;background:var(--chip);border-radius:999px;padding:6px 12px}
  .final{text-align:center;padding:34px 20px 10px}
  .final .big{font:800 clamp(56px,14vw,88px)/1 "Bricolage Grotesque",sans-serif;color:var(--gold)}
  .final .of{font:600 15px "IBM Plex Mono",monospace;color:var(--ink-soft)}
  .final h2{font:800 30px/1.15 "Bricolage Grotesque",sans-serif;margin:14px 0 6px;text-wrap:balance}
  .final .blurb{color:var(--ink-soft);max-width:46ch;margin:0 auto}
  .yourturn{text-align:left;margin-top:30px;background:var(--extract-bg);border-radius:12px;padding:20px 22px}
  .yourturn h3{font:800 18px "Bricolage Grotesque",sans-serif;margin:0 0 8px;color:var(--accent)}
  .yourturn p{margin:0 0 10px}
  .yourturn ol{margin:0;padding-left:22px}
  .yourturn li{margin-bottom:5px}
  .restart{margin-top:26px;text-align:center}
  canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:9}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
<style id="breadcrumb-css">.crumbs{font:600 13px/1.3 'Source Sans 3',system-ui,sans-serif;color:#5A6478;margin:0 0 14px}.crumbs ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:2px 0}.crumbs li+li::before{content:'/';margin:0 8px;color:#8C94A6;font-weight:400}.crumbs a{color:var(--accent,#2456A6);text-decoration:none}.crumbs a:hover,.crumbs a:focus-visible{text-decoration:underline}.crumbs [aria-current]{color:#20283A}.crumbs.bar{flex:none;margin:0;padding:7px 16px;background:#fff;border-bottom:1px solid #DDDDD3}body:has(>.crumbs.bar){display:flex;flex-direction:column}body:has(>.crumbs.bar)>.app,body:has(>.crumbs.bar)>.slide{flex:1 1 0;min-height:0;height:auto}@media print{.crumbs{display:none}}</style>
</head>

<script>
const SHAPES=["Lookup","Traversal","Aggregation","Inference"];
const R1=[
 {q:"What venues do we have?", strong:false,
  why:"A flat lookup — a single spreadsheet answers it. No entities to connect, nothing to traverse.",
  ex:"Rule of thumb: if a single row in a single spreadsheet answers it, it doesn't need a knowledge graph. The value shows up when the answer requires connecting things."},
 {q:"Which active musicians have a primary genre of Blues — or any subgenre of Blues?", strong:true,
  why:"Entities (musicians, genres) + a relationship (primary genre) + a hierarchy to traverse (subgenres) + a state (active). Testable and scoped.",
  ex:"A competency question is ready when it is Grounded, Answerable, Structured — it implies specific entities and relationships, not a flat lookup — Testable, and Scoped."},
 {q:"Tell me about the jazz scene.", strong:false,
  why:"Vague and untestable — you couldn't tell a right answer from a wrong one, and its boundaries are undefined.",
  ex:"Weak: “Tell me about our clients.” — vague and untestable. Strong questions are specific, scoped, and testable: you can tell a right answer from a wrong one."},
 {q:"Which venues have never hosted an event in a genre that any of their featured musicians list as a primary genre?", strong:true,
  why:"Traversal across venues, events, musicians, and genres — with negation. It even doubles as a data-quality check (this is CQ-X7 from the use case).",
  ex:"Integrative questions require traversing two or more subgraphs. They are the hardest questions to answer correctly and the best test of whether your cross-subgraph properties are defined consistently. — City Music Heritage use case"},
 {q:"Is the Maple Leaf Bar still open?", strong:false,
  why:"A single-record lookup — one field on one venue. No model needed.",
  ex:"Weak: “Is document X approved?” — single-record lookup, no model needed. Strong questions require connecting entities across relationships."}
];
const R2=[
 {q:"Which Zydeco events were held in the city in the last three years?", s:0,
  why:"Retrieve entities matching criteria and a time window — a classic lookup.",
  ex:"Lookup: retrieve entities that match criteria or status. Example: which deliverables on a topic were published in the last three years?"},
 {q:"Which musicians who play instruments associated with Jazz have performed at venues whose primary genre is Blues?", s:1,
  why:"Musician → instrument → genre, and musician → event → venue → genre. Hops across relationships: traversal. (This is CQ-X1.)",
  ex:"Traversal: follow relationships across hops to see how things connect. Example: for a topic, which people, projects, and documents are related — and how?"},
 {q:"Which genre concepts have no events classified against them?", s:2,
  why:"Counting coverage and surfacing a gap — aggregation.",
  ex:"Aggregation: count, measure, or surface coverage gaps. Example: which taxonomy terms have no content classified against them?"},
 {q:"Using the transitivity of “influenced by,” which living musicians can be traced back to a musician active before 1950?", s:3,
  why:"The answer isn't stored anywhere — a reasoner must derive it through owl:TransitiveProperty. Inference. (This is CQ-X8.)",
  ex:"Inference: derive answers not stored directly — a rule or reasoning is needed. Example: which experts are the sole holder of a skill an active project requires?"}
];
const R3={
 pre:"Which ", frags:[
  {t:"musicians",k:0},{t:" who ",k:-1},{t:"play instruments",k:1},{t:" are ",k:-1},
  {t:"active",k:2},{t:" and play instruments linked to ",k:-1},{t:"more than one genre",k:3},{t:"?",k:-1}],
 rows:["musicians","play instruments","active","more than one genre"],
 keys:[0,1,2,3],
 opts:["Class","Property","Controlled value","Inference rule"],
 whys:[
  "“Musicians” is a noun — it becomes a class (mus:Musician).",
  "“Play instruments” is a relationship — it becomes a property (mus:playsInstrument).",
  "“Active” is a state — it comes from a controlled value or date-range check (activeFrom / activeTo).",
  "“More than one genre” isn't stored anywhere — it needs a counting rule or query: an inference."],
 ex:"Every CQ decomposes into the ontology and taxonomy it will need: nouns → classes and taxonomy · relationships → properties · states → controlled values · and conditions like “sole holder” → a rule or query. This is the bridge from requirement to design."
};

const MAX=13;
const RANKS=[

 [9,"Session Player","Solid chops — revisit the shapes and checks you missed and you're stage-ready."],
 [6,"Open Mic","You've got the melody; the changes need practice. Reread the extracts below."],
 [0,"Tuning Up","Every virtuoso started here. Revisit the competency question materials and run it again."]
];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let step=0, score=0, results=[], R1S, R2S;

for(let k=0;k<STEPS-1;k++){const s=document.createElement("div");s.className="seg";prog.appendChild(s)}
const segs=[...prog.children];
function setbar(){

}
function where(t){document.getElementById("where").textContent=t}

function intro(){
  where("warm-up");setbar();
  card.innerHTML=`<div class="intro">
    <div class="roundchip">Before you play</div>
    <h2>A competency question is a requirement, not a query.</h2>
    <p>It's a plain-English question your finished knowledge graph must be able to answer. You write the question first — the model, the data, and the SPARQL come after, shaped by the question.</p>

    <div class="checks">

      <div class="check"><b>Testable</b><span>right ≠ wrong</span></div>

    <div class="shapes"><span>Lookup</span><span>Traversal</span><span>Aggregation</span><span>Inference</span></div>
    <div class="nav"><button class="next">Enter the forge →</button></div>
  </div>`;
  card.querySelector(".next").addEventListener("click",()=>{step=1;render()});
}
function feedback(kind,heads,why,ex,extra){
  const fb=document.getElementById("fb");
  fb.innerHTML=
   `<div class="verdict ${kind}">${heads}</div><p class="explain">${why}</p>`+
   (kind!=="ok"?`<div class="extract"><span class="lab">📖 From the course materials</span>${ex}</div>`:"")+
   (extra||"")+
   `<div class="nav"><button class="next">${step<STEPS-1?"Next →":"See my standing →"}</button></div>`;
  fb.querySelector(".next").addEventListener("click",()=>{step++;step<STEPS?render():finish()});
  fb.querySelector(".next").focus();
}
function r1(idx){

      <button class="ans" data-v="0">🫥 Weak</button>

    const guess=b.dataset.v==="1", good=guess===it.strong;
    results[step-1]=good?"ok":"miss"; if(good)score++;
    card.querySelectorAll(".ans").forEach(x=>{
      x.disabled=true;
      const v=x.dataset.v==="1";
      if(v===it.strong)x.classList.add("right"); else if(x===b)x.classList.add("wrong"); else x.classList.add("dim");
    });
    feedback(good?"ok":"miss", good?"✓ Called it.":"✗ Not quite.",
      `This one is <strong>${it.strong?"strong":"weak"}</strong>. ${it.why}`, it.ex);
  }));
}
function r2(idx){
  const it=R2S[idx];
  where(`round 2 · ${idx+1}/4 · name the shape`);setbar();
  card.innerHTML=`<div class="roundchip">Round 2 · Name the Shape</div>
    <p class="qtext">What shape of question is this?</p>
    <div class="cq"><span class="qm">“</span>${it.q}<span class="qm">”</span></div>
    <div class="answers">`+SHAPES.map((s,k)=>`<button class="ans" data-k="${k}"><strong>${s}</strong></button>`).join("")+
    `</div><div id="fb"></div>`;
  card.querySelectorAll(".ans").forEach(b=>b.addEventListener("click",()=>{
    const k=+b.dataset.k, good=k===it.s;
    results[step-1]=good?"ok":"miss"; if(good)score++;
    card.querySelectorAll(".ans").forEach(x=>{
      x.disabled=true;const xk=+x.dataset.k;
      if(xk===it.s)x.classList.add("right"); else if(xk===k)x.classList.add("wrong"); else x.classList.add("dim");
    });
    feedback(good?"ok":"miss", good?`✓ ${SHAPES[it.s]} it is.`:"✗ Not quite.",
      `<strong>${SHAPES[it.s]}.</strong> ${it.why}`, it.ex);
  }));
}
function r3(){
  where("round 3 · break it down");setbar();
  const cqHtml=R3.frags.map((f,i)=>f.k<0?f.t:`<span class="frag"><span class="n">${f.k+1}</span> ${f.t}</span>`).join("");
  card.innerHTML=`<div class="roundchip">Round 3 · Break It Down</div>
    <p class="qtext">Every CQ decomposes into the model it needs. Tag each highlighted part:</p>
    <div class="cq"><span class="qm">“</span>${R3.pre}${cqHtml}<span class="qm">”</span></div>
    <div class="match">`+R3.rows.map((r,ri)=>
      `<div class="mrow"><span class="mbox"><span class="n">${ri+1}</span>${r}</span><div class="mchips">`+
      shuf(R3.opts.map((o,oi)=>({o,oi}))).map(({o,oi})=>`<button class="chip" data-r="${ri}" data-o="${oi}">${o}</button>`).join("")+
      `</div></div>`).join("")+
    `</div><div id="fb"></div>`;
  const picks=[null,null,null,null];
  card.querySelectorAll(".chip").forEach(ch=>ch.addEventListener("click",()=>{
    const r=+ch.dataset.r;
    card.querySelectorAll(`.chip[data-r="${r}"]`).forEach(c=>c.classList.remove("sel"));
    ch.classList.add("sel");picks[r]=+ch.dataset.o;
    if(picks.every(p=>p!==null)){
      let got=0;
      card.querySelectorAll(".chip").forEach(c=>{
        c.disabled=true;const cr=+c.dataset.r,co=+c.dataset.o;
        if(co===R3.keys[cr])c.classList.add("right");
        else if(c.classList.contains("sel"))c.classList.add("wrong");
        c.classList.remove("sel");
      });
      picks.forEach((p,r2)=>{if(p===R3.keys[r2])got++});
      score+=got;
      results[step-1]=got===4?"ok":got>0?"part":"miss";
      const detail=`<div class="extract"><span class="lab">The decomposition</span>`+
        R3.whys.map((w,i)=>`<div style="margin-bottom:6px"><strong>${i+1}. ${R3.opts[R3.keys[i]]}</strong> — ${w}</div>`).join("")+`</div>`;
      feedback(got===4?"ok":got>0?"part":"miss",
        got===4?"✓ All four — the full bridge from question to model.":`${got}/4 — see the full decomposition below.`,
        got===4?R3.whys[3]:R3.ex, R3.ex, detail);
    }
  }));
}
function render(){
  if(step===0)return intro();
  if(step<=R1.length)return r1(step-1);
  if(step<=R1.length+R2.length)return r2(step-1-R1.length);
  return r3();
}
function finish(){
  where("done");
  segs.forEach((s,k)=>{s.className="seg "+(results[k]==="ok"?"ok":results[k]==="part"?"part":"miss")});
  document.getElementById("score").textContent=score;
  const rank=RANKS.find(r=>score>=r[0]);
  card.innerHTML=`<div class="final">
    <div class="big">${score}</div><div class="of">out of ${MAX}</div>
    <h2>${rank[1]}</h2><p class="blurb">${rank[2]}</p>
  </div>
  <div class="yourturn">
    <h3>🎷 Your turn — for real this time</h3>
    <p>Head to the <strong>Your Competency Questions</strong> assignment and draft CQs for your subgraph (Genres, Instruments, Events &amp; Venues, or Musicians). For each one:</p>
    <ol>
      <li>Run it through the five checks: <strong>Grounded · Answerable · Structured · Testable · Scoped</strong></li>
      <li>Aim for coverage across the four shapes — not eight versions of the same lookup</li>
      <li>Decompose it: nouns → classes · relationships → properties · states → controlled values · conditions → rules</li>
    </ol>
    <p style="margin-top:10px;margin-bottom:0"><em>Remember: a CQ your ontology can't answer isn't a failure — it's a finding. Document the gap.</em></p>
  </div>
  <div class="restart"><button class="next" id="again">Run it again</button></div>`;
  document.getElementById("again").addEventListener("click",()=>{step=0;score=0;results=[];reshuffle();render()});
  if(score>=12 && !matchMedia("(prefers-reduced-motion: reduce)").matches) confetti();
}
function confetti(){
  const cv=document.getElementById("confetti"),ctx=cv.getContext("2d");
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#2456A6","#B98A12","#2F7D4F","#B23B26","#7FA6E8"];
  const ps=Array.from({length:140},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,
    v:2+Math.random()*3,w:6+Math.random()*6,a:Math.random()*6.28,s:(Math.random()-.5)*.2,c:cols[Math.random()*cols.length|0]}));
  let t=0;
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.y+=p.v;p.a+=p.s;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);
      ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);ctx.restore()});
    if(++t<260)requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}
render();
</script>
