<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concepts, Schemes &amp; Triples</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  :root{
    --paper:#F7F7F2; --grid:rgba(36,86,166,.07); --surface:#FFFFFF; --ink:#20283A;
    --ink-soft:#5A6478; --accent:#2456A6; --accent-ink:#FFFFFF; --line:#DDDDD3;
    --ok:#2F7D4F; --ok-bg:#EAF3ED; --miss:#B23B26; --miss-bg:#F7ECE8;
    --gold:#B98A12; --chip:#EEEEE6; --extract-bg:#F1F3F8; --shadow:0 2px 10px rgba(32,40,58,.08);
  }
  *{box-sizing:border-box}
  body{
    margin:0; color:var(--ink); font:400 17px/1.55 "Source Sans 3",system-ui,sans-serif;
    background:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:28px 28px; min-height:100vh;
  }
  .wrap{max-width:660px;margin:0 auto;padding:28px 20px 80px}
  header{margin-bottom:20px;position:relative;padding-right:96px}
  .logo{position:absolute;top:0;right:0;height:64px;width:auto;background:#fff;border-radius:10px;padding:3px 6px}
  .eyebrow{font:600 12px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  h1{font:800 clamp(30px,6vw,42px)/1.08 "Bricolage Grotesque","Source Sans 3",sans-serif;margin:.35em 0 .2em;text-wrap:balance}
  .sub{color:var(--ink-soft);margin:0}
  .progress{display:flex;gap:5px;margin:22px 0 26px}
  .seg{flex:1;height:7px;border-radius:4px;background:var(--chip);transition:background .3s}
  .seg.ok{background:var(--ok)} .seg.miss{background:var(--miss)} .seg.now{background:var(--accent)}
  .scorebar{display:flex;justify-content:space-between;align-items:baseline;font:600 13px "IBM Plex Mono",monospace;color:var(--ink-soft)}
  .scorebar b{color:var(--gold);font-size:15px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 24px;position:relative}
  .partchip{display:inline-block;font:600 11px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:6px 12px;margin-bottom:14px}
  .qnum{font:800 15px "Bricolage Grotesque",sans-serif;color:var(--ink-soft);margin-bottom:4px}
  .qtext{font:600 21px/1.35 "Source Sans 3",sans-serif;margin:0 0 18px;text-wrap:balance}
  .answers{display:flex;flex-direction:column;gap:10px}
  button.ans{
    text-align:left;font:400 16.5px/1.4 "Source Sans 3",sans-serif;color:var(--ink);
    background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:13px 16px;
    cursor:pointer;transition:border-color .15s,transform .1s,background .15s;display:flex;gap:12px;align-items:baseline;
  }
  button.ans:hover:not(:disabled){border-color:var(--accent);transform:translateX(3px)}
  button.ans:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  button.ans:disabled{cursor:default}
  button.ans .key{font:600 13px "IBM Plex Mono",monospace;color:var(--accent);flex-shrink:0}
  button.ans.right{background:var(--ok-bg);border-color:var(--ok)}
  button.ans.wrong{background:var(--miss-bg);border-color:var(--miss)}
  button.ans.dim{opacity:.45}
  .match{display:flex;flex-direction:column;gap:14px}
  .mrow{display:flex;flex-direction:column;gap:8px}
  .mbox{font:600 15px "IBM Plex Mono",monospace}
  .mchips{display:flex;gap:8px;flex-wrap:wrap}
  button.chip{
    font:400 14.5px "Source Sans 3",sans-serif;color:var(--ink);background:var(--chip);
    border:1.5px solid transparent;border-radius:999px;padding:8px 14px;cursor:pointer;transition:all .15s;
  }
  button.chip:hover:not(:disabled){border-color:var(--accent)}
  button.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  button.chip.sel{background:var(--accent);color:var(--accent-ink)}
  button.chip.right{background:var(--ok-bg);color:var(--ink);border-color:var(--ok)}
  button.chip.wrong{background:var(--miss-bg);color:var(--ink);border-color:var(--miss)}
  button.chip:disabled{cursor:default;opacity:.85}
  .verdict{display:flex;align-items:center;gap:10px;font:700 18px "Bricolage Grotesque",sans-serif;margin:18px 0 0}
  .verdict.ok{color:var(--ok)} .verdict.miss{color:var(--miss)}
  .explain{margin:8px 0 0;color:var(--ink-soft)}
  .extract{
    margin-top:14px;background:var(--extract-bg);border-left:3px solid var(--accent);
    border-radius:0 10px 10px 0;padding:14px 16px;font-size:15.5px;color:var(--ink);
  }
  .extract .lab{font:600 11px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:8px}
  .extract em{color:var(--ink-soft);font-style:normal;font-size:14px;display:block;margin-top:8px}
  .nav{display:flex;justify-content:flex-end;margin-top:20px}
  button.next{
    font:700 16px "Bricolage Grotesque",sans-serif;color:var(--accent-ink);background:var(--accent);
    border:none;border-radius:10px;padding:13px 26px;cursor:pointer;transition:transform .12s,opacity .15s;
  }
  button.next:hover{transform:translateY(-1px)}
  button.next:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  .final{text-align:center;padding:40px 24px}
  .final .big{font:800 clamp(56px,14vw,88px)/1 "Bricolage Grotesque",sans-serif;color:var(--gold)}
  .final .of{font:600 15px "IBM Plex Mono",monospace;color:var(--ink-soft)}
  .final h2{font:800 30px/1.15 "Bricolage Grotesque",sans-serif;margin:14px 0 6px;text-wrap:balance}
  .final .blurb{color:var(--ink-soft);max-width:44ch;margin:0 auto}
  .review{text-align:left;margin-top:30px;border-top:1px solid var(--line);padding-top:22px}
  .review h3{font:600 13px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 14px}
  .review .item{margin-bottom:18px}
  .review .item p{margin:0 0 6px;font-weight:600}
  .restart{margin-top:28px}
  canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:9}
  @media (prefers-reduced-motion: reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
<style id="breadcrumb-css">.crumbs{font:600 13px/1.3 'Source Sans 3',system-ui,sans-serif;color:#5A6478;margin:0 0 14px}.crumbs ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:2px 0}.crumbs li+li::before{content:'/';margin:0 8px;color:#8C94A6;font-weight:400}.crumbs a{color:var(--accent,#2456A6);text-decoration:none}.crumbs a:hover,.crumbs a:focus-visible{text-decoration:underline}.crumbs [aria-current]{color:#20283A}.crumbs.bar{flex:none;margin:0;padding:7px 16px;background:#fff;border-bottom:1px solid #DDDDD3}body:has(>.crumbs.bar){display:flex;flex-direction:column}body:has(>.crumbs.bar)>.app,body:has(>.crumbs.bar)>.slide{flex:1 1 0;min-height:0;height:auto}@media print{.crumbs{display:none}}</style>

const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

function render(){
  segs.forEach((s,k)=>{s.className="seg"+(results[k]===true?" ok":results[k]===false?" miss":k===i?" now":"")});
  document.getElementById("score").textContent=score;
  document.getElementById("where").textContent=(i+1)+" / "+QUIZ.length+" · "+QUIZ[i].part;
  const Q=QUIZ[i];
  let h=`<div class="partchip">${esc(Q.part)}</div><div class="qnum">Question ${i+1}</div><p class="qtext">${Q.q}</p>`;
  if(Q.match){
    h+=`<div class="match">`+Q.rows.map((r,ri)=>
      `<div class="mrow"><span class="mbox">${r}</span><div class="mchips">`+
      shuf(Q.opts.map((o,oi)=>({o,oi}))).map(({o,oi})=>`<button class="chip" data-r="${ri}" data-o="${oi}">${o}</button>`).join("")+
      `</div></div>`).join("")+`</div>`;
  } else {
    h+=`<div class="answers">`+shuf(Q.a.map((a,k)=>({a,k}))).map(({a,k},pos)=>
      `<button class="ans" data-k="${k}"><span class="key">${"ABCD"[pos]}</span><span>${a}</span></button>`).join("")+`</div>`;
  }
  h+=`<div id="fb"></div>`;
  card.innerHTML=h;
  if(Q.match){
    const picks=[null,null,null];
    card.querySelectorAll(".chip").forEach(ch=>ch.addEventListener("click",()=>{
      const r=+ch.dataset.r;
      card.querySelectorAll(`.chip[data-r="${r}"]`).forEach(c=>c.classList.remove("sel"));
      ch.classList.add("sel"); picks[r]=+ch.dataset.o;
      if(picks.every(p=>p!==null)) settleMatch(Q,picks);
    }));
  } else {
    card.querySelectorAll(".ans").forEach(b=>b.addEventListener("click",()=>settle(Q,+b.dataset.k)));
  }
}
function feedback(Q,good){
  const fb=document.getElementById("fb");
  fb.innerHTML=
   `<div class="verdict ${good?"ok":"miss"}">${good?"✓ Correct!":"✗ Not quite."}</div>`+
   `<p class="explain">${Q.ok}</p>`+
   (good?"":`<div class="extract"><span class="lab">📖 From the Module 3 materials</span>${Q.ex}${Q.src?`<em>— ${Q.src}</em>`:""}</div>`)+
   `<div class="nav"><button class="next">${i<QUIZ.length-1?"Next question →":"See my standing →"}</button></div>`;
  fb.querySelector(".next").addEventListener("click",()=>{i++; i<QUIZ.length?render():finish()});
  fb.querySelector(".next").focus();
}
function settle(Q,k){
  const good=k===Q.c; results[i]=good; if(good)score++;
  card.querySelectorAll(".ans").forEach(b=>{
    b.disabled=true; const bk=+b.dataset.k;
    if(bk===Q.c)b.classList.add("right"); else if(bk===k)b.classList.add("wrong"); else b.classList.add("dim");
  });
  segs[i].className="seg "+(good?"ok":"miss");
  document.getElementById("score").textContent=score;
  feedback(Q,good);
}
function settleMatch(Q,picks){
  const good=picks.every((p,r)=>p===Q.key[r]); results[i]=good; if(good)score++;
  card.querySelectorAll(".chip").forEach(ch=>{
    ch.disabled=true; const r=+ch.dataset.r,o=+ch.dataset.o;
    if(o===Q.key[r])ch.classList.add("right");
    else if(ch.classList.contains("sel"))ch.classList.add("wrong");
    ch.classList.remove("sel");
  });
  segs[i].className="seg "+(good?"ok":"miss");
  document.getElementById("score").textContent=score;
  feedback(Q,good);
}
function finish(){
  document.getElementById("where").textContent="done";
  segs.forEach((s,k)=>{s.className="seg "+(results[k]?"ok":"miss")});
  const rank=RANKS.find(r=>score>=r[0]);
  const missed=QUIZ.map((q,k)=>({q,k})).filter(x=>!results[x.k]);
  card.innerHTML=`<div class="final">
    <div class="big">${score}</div><div class="of">out of 12</div>
    <h2>${rank[1]}</h2><p class="blurb">${rank[2]}</p>
    ${missed.length?`<div class="review"><h3>Read up on what you missed</h3>`+
      missed.map(x=>`<div class="item"><p>Q${x.k+1} · ${x.q.q}</p><div class="extract"><span class="lab">📖 From the Module 3 materials</span>${x.q.ex}${x.q.src?`<em>— ${x.q.src}</em>`:""}</div></div>`).join("")+`</div>`:""}
    <div class="restart"><button class="next" id="again">Take it again</button></div>
  </div>`;
  document.getElementById("again").addEventListener("click",()=>{i=0;score=0;results=[];render()});
  if(score>=11 && !matchMedia("(prefers-reduced-motion: reduce)").matches) confetti();
}
function confetti(){
  const cv=document.getElementById("confetti"),ctx=cv.getContext("2d");
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#2456A6","#B98A12","#2F7D4F","#B23B26","#7FA6E8"];
  const ps=Array.from({length:140},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,
    v:2+Math.random()*3,w:6+Math.random()*6,a:Math.random()*6.28,s:(Math.random()-.5)*.2,c:cols[Math.random()*cols.length|0]}));
  let t=0;
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.y+=p.v;p.a+=p.s;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);
      ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);ctx.restore()});
    if(++t<260)requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}
render();
</script>
</body>
</html>
