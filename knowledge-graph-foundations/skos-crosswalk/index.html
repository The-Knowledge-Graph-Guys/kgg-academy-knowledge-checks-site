/* ───────── step 5 · review & export ───────── */
function canon(x){ return x.a < x.b ? {k:x.a+' '+x.b, a:x.a, b:x.b, p:x.p} : {k:x.b+' '+x.a, a:x.b, b:x.a, p:INV[x.p]}; }
function reviewFlags(){
  const F=[]; const mine=S.maps;
  if(!mine.length) return F;
  const seenComp=new Set();
  for(const x of mine.filter(x=>x.p==='exactMatch')){ const comp=exactComponent(x.a).sort(); const id=comp.join(' '); if(seenComp.has(id)) continue; seenComp.add(id);
    const bySrc=new Map(); comp.forEach(i => { const c=findConcept(i); if(c){ if(!bySrc.has(c.src)) bySrc.set(c.src,[]); bySrc.get(c.src).push(label(c)); } });
    for(const [src,labs] of bySrc) if(labs.length>1) F.push({lvl:'bad', t:`Your exact matches chain together ${labs.map(l=>'“'+l+'”').join(' and ')}, two concepts from the same scheme (${srcById(src).title}). exactMatch is transitive, so you have declared them one concept.`, d:['Downgrade one link in the chain to closeMatch.']});
    if(comp.length>2) F.push({lvl:'info', t:`Entailed by transitivity: ${comp.map(i=>'“'+nameOf(i)+'”').join(' = ')}.`, d:['You asserted some of these pairs; a reasoner adds the rest.']});
  }
  const blind = mine.filter(x => x.p==='exactMatch' && (!(findConcept(x.a,x.aSrc)||{def:[]}).def.length || !(findConcept(x.b,x.bSrc)||{def:[]}).def.length));
  if(blind.length) F.push({lvl:'warn', t:`${blind.length} exact match${blind.length===1?'':'es'} made where one side has no definition.`, d:blind.map(x=>`${nameOf(x.a,x.aSrc)} = ${nameOf(x.b,x.bSrc)}`)});
  const share = mine.filter(x=>x.p==='exactMatch').length / mine.length;
  if(mine.length>=5 && share>0.7) F.push({lvl:'warn', t:'Most of your mappings are exactMatch.', d:['Four groups rarely draw the same boundary around a concept. Look again for close, broader and related matches.']});
  const cm = classMaps(), dis=[];
  for(const x of mine){ const c=canon(x); const other = cm.map(canon).filter(y => y.k===c.k && y.p!==c.p); if(other.length) dis.push(`${nameOf(c.a)} / ${nameOf(c.b)}: you say ${c.p}, a classmate says ${[...new Set(other.map(o=>o.p))].join(', ')}`); }
  if(dis.length) F.push({lvl:'info', t:'You and a classmate mapped the same pair differently. Worth a conversation.', d:dis});
  const rels=new Set(mine.map(x=>x.p)).size;
  if(mine.length>=GOAL.maps && rels>=GOAL.rels && !F.some(f=>f.lvl==='bad')) F.unshift({lvl:'good', t:'Target met: enough mappings, a range of relations, and no contradictions.', d:[]});
  return F;
}
function mapGraph(list){
  const cols=[]; list.forEach(x => [x.aSrc,x.bSrc].forEach(id => { if(id && srcById(id) && !cols.includes(id)) cols.push(id); }));
  cols.sort((p,q) => GROUPS.findIndex(g=>g.id===srcById(p).group)-GROUPS.findIndex(g=>g.id===srcById(q).group));
  if(cols.length<2) return '';
  const W=1140, colW=W/cols.length, nw=Math.min(210,colW-46), nh=28, gap=40, top=64;
  const nodes=new Map(); const colNodes=cols.map(()=>[]);
  list.forEach(x => [[x.a,x.aSrc],[x.b,x.bSrc]].forEach(([iri,src]) => { const ci=cols.indexOf(src); if(ci<0||nodes.has(iri)) return; const n={iri, ci, lab:nameOf(iri,src)}; nodes.set(iri,n); colNodes[ci].push(n); }));
  colNodes.forEach((arr,ci) => { arr.sort((a,b)=>a.lab.localeCompare(b.lab)); arr.forEach((n,i) => { n.x=colW*ci+colW/2; n.y=top+i*gap+nh/2; }); });
  let H = top + Math.max(...colNodes.map(a=>a.length))*gap + 14;
  const style = {exactMatch:['#2456A6','',3], closeMatch:['#2456A6','6 5',2], broadMatch:['#B98A12','',2], narrowMatch:['#B98A12','',2], relatedMatch:['#6B3FA0','2 5',2]};
  const maxCh = Math.floor((nw-18)/6.4);
  let edges='', lanes=0;
  list.forEach(x => { let n1=nodes.get(x.a), n2=nodes.get(x.b); if(!n1||!n2||n1.ci===n2.ci) return;
    let arrow=false; if(x.p==='narrowMatch'){ [n1,n2]=[n2,n1]; arrow=true; } else if(x.p==='broadMatch') arrow=true;      // path runs narrower → broader
    const dir = n1.ci<n2.ci ? 1 : -1, x1=n1.x+dir*nw/2, x2=n2.x-dir*(nw/2+(arrow?7:0)); const [c,dash,w]=style[x.p];
    let d;
    if(Math.abs(n1.ci-n2.ci)===1){ const mx=(x1+x2)/2; d=`M${x1},${n1.y} C${mx},${n1.y} ${mx},${n2.y} ${x2},${n2.y}`; }
    else {   // skips a column: run in a lane underneath the columns in between, never behind their concepts
      const between = colNodes.slice(Math.min(n1.ci,n2.ci)+1, Math.max(n1.ci,n2.ci));
      const lane = top + Math.max(...between.map(a=>a.length))*gap + 4 + (lanes++)*11;
      const xa = n1.x+dir*(colW/2+6), xb = n2.x-dir*(colW/2+6), m1=(x1+xa)/2, m2=(xb+x2)/2;
      d=`M${x1},${n1.y} C${m1},${n1.y} ${m1},${lane} ${xa},${lane} L${xb},${lane} C${m2},${lane} ${m2},${n2.y} ${x2},${n2.y}`;
      H = Math.max(H, lane+18);
    }
    edges += `<path class="e" d="${d}" stroke="${c}" stroke-width="${w}"${dash?` stroke-dasharray="${dash}"`:''}${arrow?' marker-end="url(#arr)"':''}><title>${esc(nameOf(x.a,x.aSrc))} skos:${x.p} ${esc(nameOf(x.b,x.bSrc))}${x.by?' · '+esc(x.by):''}</title></path>`; });
  const heads = cols.map((id,ci) => { const m=srcById(id); const t=G(m.group).name; return `<text class="col" x="${colW*ci+colW/2}" y="22" text-anchor="middle">${esc(t)}<title>${esc(m.title)}</title></text><text class="colby" x="${colW*ci+colW/2}" y="40" text-anchor="middle">${esc(whoOf(m).length>28?whoOf(m).slice(0,27)+'…':whoOf(m))}</text>`; }).join('');
  const ns = [...nodes.values()].map(n => { const m=srcById(cols[n.ci]); const t=n.lab.length>maxCh?n.lab.slice(0,maxCh-1)+'…':n.lab; return `<g class="n"><rect x="${n.x-nw/2}" y="${n.y-nh/2}" width="${nw}" height="${nh}" rx="14" stroke="${G(m.group).c}"/><text x="${n.x}" y="${n.y+4}" text-anchor="middle">${esc(t)}</text><title>${esc(n.lab)} — ${esc(((findConcept(n.iri,cols[n.ci])||{def:[]}).def[0]||{}).v||'no definition')}</title></g>`; }).join('');
  return `<div class="graphwrap"><svg class="graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapping graph"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B98A12"/></marker></defs>${heads}${edges}${ns}</svg></div>
    <div class="legend"><span><svg width="34" height="8"><line x1="0" y1="4" x2="34" y2="4" stroke="#2456A6" stroke-width="3"/></svg>exactMatch</span><span><svg width="34" height="8"><line x1="0" y1="4" x2="34" y2="4" stroke="#2456A6" stroke-width="2" stroke-dasharray="6 5"/></svg>closeMatch</span><span><svg width="34" height="10"><line x1="0" y1="5" x2="26" y2="5" stroke="#B98A12" stroke-width="2"/><path d="M26,1 L34,5 L26,9 z" fill="#B98A12"/></svg>broad / narrow (arrow points at the broader concept)</span><span><svg width="34" height="8"><line x1="0" y1="4" x2="34" y2="4" stroke="#6B3FA0" stroke-width="2" stroke-dasharray="2 5"/></svg>relatedMatch</span></div>`;
}
function mappingTtl(){
  const by = myName()||'Unnamed';
  const lines = ['@prefix rdf:  <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .','@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .','@prefix skos: <http://www.w3.org/2004/02/skos/core#> .','@prefix dct:  <http://purl.org/dc/terms/> .','', `# SKOS Crosswalk · mappings by ${by.replace(/[\r\n]/g,' ')} · ${today()}`, '# One direction is stated for each pair; the inverse (narrowMatch for broadMatch, and so on) is entailed.',''];
  const iri = i => '<'+i.replace(/[<>"{}|^`\\\s]/g, ch => '%'+ch.charCodeAt(0).toString(16).toUpperCase().padStart(2,'0'))+'>';
  for(const x of S.maps){ lines.push(`# ${nameOf(x.a,x.aSrc)} (${(srcById(x.aSrc)||{title:'?'}).title})  ${x.p}  ${nameOf(x.b,x.bSrc)} (${(srcById(x.bSrc)||{title:'?'}).title})`.replace(/[\r\n]/g,' ')); if(x.note) lines.push('# why: '+x.note.replace(/[\r\n]/g,' ')); lines.push(`${iri(x.a)} skos:${x.p} ${iri(x.b)} .`, ''); }
  return lines.join('\n');
}
function mappingCsv(){ const q = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; return [['source label','source scheme','source IRI','relation','target label','target scheme','target IRI','why','mapped by']].concat(S.maps.map(x => [nameOf(x.a,x.aSrc),(srcById(x.aSrc)||{}).title,x.a,'skos:'+x.p,nameOf(x.b,x.bSrc),(srcById(x.bSrc)||{}).title,x.b,x.note,myName()])).map(r => r.map(q).join(',')).join('\r\n'); }
function renderReview(){
  const cm = classMaps(); if(S.layer!=='mine' && !cm.length) S.layer='mine';
  const mine = S.maps.map(x => Object.assign({by:myName()||'you'}, x));
  const shown = S.layer==='mine' ? mine : S.layer==='class' ? cm : mine.concat(cm);
  const F = reviewFlags(); const fname = 'mapping--'+slug(myName()||'unnamed')+'.ttl';
  // where the class disagrees
  const byPair = new Map(); mine.concat(cm).forEach(x => { const c=canon(x); if(!byPair.has(c.k)) byPair.set(c.k,[]); byPair.get(c.k).push(Object.assign({by:x.by},c)); });
  const split = [...byPair.values()].filter(a => new Set(a.map(y=>y.p)).size>1);
  $('#card').innerHTML = `
    <h2>Review &amp; export</h2>
    <p>Your crosswalk as a graph, checked for the mistakes mapping invites. Export it as Turtle and hand it in the same way as your scheme, so the class can see where the four vocabularies meet, and where people disagree.</p>
    <div class="filters"><span class="mono" style="color:var(--ink-soft)">SHOW</span><button class="chip${S.layer==='mine'?' sel':''}" data-layer="mine">Mine (${mine.length})</button><button class="chip${S.layer==='class'?' sel':''}" data-layer="class"${cm.length?'':' disabled'}>The class (${cm.length})</button><button class="chip${S.layer==='both'?' sel':''}" data-layer="both"${cm.length?'':' disabled'}>Both</button></div>
    ${shown.length ? (mapGraph(shown) || '<p class="muted">The mapped concepts are not in the schemes loaded here, so there is nothing to draw.</p>') : '<p class="muted">No mappings yet. Make some under <b>Map across schemes</b>.</p>'}
    ${F.length?`<h3>Checks on your mappings</h3>${flagsHtml(F)}`:''}
    ${split.length?`<h3>Where the class disagrees</h3><table class="tbl"><thead><tr><th>Pair</th><th>Relations asserted</th></tr></thead><tbody>${split.map(a => `<tr><td><b>${esc(nameOf(a[0].a))}</b> / <b>${esc(nameOf(a[0].b))}</b></td><td>${a.map(y => `<span class="relname">skos:${y.p}</span> <span class="muted small">(${esc(y.by)})</span>`).join(', ')}</td></tr>`).join('')}</tbody></table>`:''}
    ${mine.length?`<h3>Your mappings</h3>${mapsTable(S.maps,true)}
      <h3>Export</h3><div class="exports"><button id="x-ttl">Mapping file<span class="fmt">.ttl</span></button><button id="x-csv">Spreadsheet<span class="fmt">.csv</span></button><button id="x-copy">Copy the Turtle</button></div>
      <details><summary>Preview the Turtle</summary><pre class="ttl">${esc(mappingTtl())}</pre></details>
      ${CONFIG.api ? `<div class="note"><span class="lab">Hand it in</span>Submit your mappings to the class graph store. They appear for everyone under "The class", and resubmitting replaces your earlier set.</div>${submitBox('sendmaps','my mappings')}` : `<div class="note"><span class="lab">Hand it in</span>Download <b>${esc(fname)}</b> and submit it the same way as your scheme. Once it is in the class folder, your mappings appear here for everyone under "The class".</div>`}
      <div class="btns"><button class="ghost small danger" id="wipe">Clear all my mappings</button></div>`:''}
    ${cm.length?`<details${S.layer==='class'?' open':''}><summary>Mappings handed in by the class (${cm.length})</summary>${mapsTable(cm,false)}</details>`:''}`;
  document.querySelectorAll('[data-layer]').forEach(b => b.onclick = () => { S.layer=b.dataset.layer; render(); });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { S.maps.splice(+b.dataset.del,1); render(); });
  const need = () => { if(!myName()){ toast('Add your own name under Check & submit first, so the file is named after you.'); return false; } return true; };
  const sm=$('#sendmaps'); if(sm) sm.onclick = () => submitToClass('mapping', mappingTtl(), sm);
  if($('#x-ttl')){ $('#x-ttl').onclick = () => { if(need()){ download(fname, mappingTtl(), 'text/turtle'); S.done.mapFile = fname; save(); toast('Downloaded '+fname+'. Now upload it to Classroom.'); render(); } };
    $('#x-csv').onclick = () => download('skos-crosswalk-mappings-'+slug(myName()||'unnamed')+'-'+today()+'.csv', mappingCsv(), 'text/csv');
    $('#x-copy').onclick = () => navigator.clipboard.writeText(mappingTtl()).then(()=>toast('Turtle copied.'));
    $('#wipe').onclick = () => { if(confirm('Remove all '+S.maps.length+' of your mappings?')){ S.maps=[]; render(); } }; }
}

/* ───────── go ───────── */
(async function(){ await loadClass(); loadMine(); render(); })();
</script>
