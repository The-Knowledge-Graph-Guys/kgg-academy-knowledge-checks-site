<title>Domain Detective</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  /* Shared knowledge-check palette (matches Week 1): paper, ink, one blue accent, gold for emphasis */
  :root {
    --bg: #F7F7F2;
    --paper: #FFFFFF;
    --ink: #20283A;
    --ink-2: #5A6478;
    --ink-3: #8C94A6;
    --line: #DDDDD3;
    --line-strong: #C5C8BE;
    --accent: #2456A6;
    --accent-ink: #FFFFFF;
    --accent-soft: #E6EDF8;
    --word: #2456A6;
    --new: #B98A12;
    --grid: rgba(36,86,166,0.07);
    --veil: rgba(247,247,242,0.84);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  h1, h2 { font-family: "Bricolage Grotesque", "IBM Plex Sans", sans-serif; text-wrap: balance; margin: 0; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .slide { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }

  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 18px 28px 10px; }
  .top h1 { font-size: clamp(22px, 3vw, 32px); font-weight: 800; letter-spacing: -0.01em; }
  .top h1 span { color: var(--accent); }
  .top .prompt { color: var(--ink-2); font-size: clamp(14px, 1.6vw, 18px); }

  .stage {
    position: relative; margin: 0 28px;
    border: 1px solid var(--line); border-radius: 16px; background: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px; background-position: center;
    overflow: hidden; min-height: 240px;
  }
  .word {
    position: absolute; white-space: nowrap;
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; letter-spacing: -0.015em;
    font-size: clamp(26px, 4.2vw, 48px); line-height: 1; padding: 6px 10px; border-radius: 8px; color: var(--word);
    transform: scale(0.4); opacity: 0; user-select: none;
    transition: transform 460ms cubic-bezier(.2,.9,.3,1.25), opacity 340ms ease, color 700ms ease;
  }
  .word.in { transform: scale(1); opacity: 1; }
  .word.new { color: var(--new); }
  .logo { height: 56px; width: auto; background: #fff; border-radius: 10px; padding: 3px 6px; flex: none; }

  .reveal {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    background: var(--veil); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none; transition: opacity 300ms ease;
  }
  .reveal.on { opacity: 1; pointer-events: auto; }
  .reveal .eyebrow { font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
  .reveal h2 { font-size: clamp(48px, 9vw, 112px); font-weight: 800; line-height: 1; letter-spacing: -0.02em; color: var(--accent); margin: 6px 0 10px; }
  .reveal p { margin: 0; font-size: clamp(16px, 2vw, 22px); color: var(--ink); }

  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding: 14px 28px 20px; }
  .count { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: clamp(18px, 2.2vw, 24px); font-variant-numeric: tabular-nums; }
  .count small { font-family: "IBM Plex Sans", sans-serif; font-weight: 500; font-size: 14px; color: var(--ink-3); margin-left: 8px; }
  .controls { display: flex; gap: 10px; }
  .btn { padding: 12px 20px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--paper); color: var(--ink); font-weight: 600; font-size: clamp(14px, 1.5vw, 17px); }
  .btn:hover { border-color: var(--ink-3); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  kbd { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 6px; border: 1px solid currentColor; opacity: 0.6; font: 600 12px "IBM Plex Sans", sans-serif; }
  .keys { font-size: 13px; color: var(--ink-3); }

  .done { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: var(--paper); border-radius: 16px; }
  .done h2 { font-size: clamp(30px, 5vw, 56px); font-weight: 800; letter-spacing: -0.015em; }
  .done p { color: var(--ink-2); max-width: 48ch; margin: 8px auto 0; font-size: clamp(15px, 1.8vw, 20px); }
  .done table { border-collapse: collapse; margin: 20px auto 0; font-size: clamp(15px, 1.8vw, 20px); }
  .done th { text-align: left; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; padding: 8px 22px 8px 0; border-bottom: 1px solid var(--line); }
  .done td { padding: 10px 22px 10px 0; border-bottom: 1px solid var(--line); text-align: left; font-variant-numeric: tabular-nums; }
  .done td.n { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; }

  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .word, .reveal { transition: none; } }
</style>

  <div class="stage" id="stage" aria-live="polite">
    <div class="reveal" id="reveal">
      <div>
        <div class="eyebrow">The domain was</div>
        <h2 id="revealName"></h2>
        <p id="revealNote"></p>
      </div>
    </div>
    <div class="done hidden" id="done">
      <div>
        <h2>How many words did it take?</h2>
        <p>Ten of the words appeared every time. The rest belonged to one world only.</p>
        <table>
          <thead><tr><th>Domain</th><th>Words needed</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="bar">
    <div class="count" id="count">Word 1</div>
    <div class="controls">
      <button class="btn" id="restartBtn" type="button">Start over<kbd>R</kbd></button>
      <button class="btn" id="nextBtn" type="button">Next word<kbd>Space</kbd></button>
      <button class="btn primary" id="gotBtn" type="button">They've got it<kbd>Enter</kbd></button>
    </div>
  </div>
</div>

<script>
(function () {
  const SHARED = ["Claim", "Capacity", "Consent", "Record", "Exposure", "Liability", "Settlement", "Discharge", "Compliance", "Underwriting"];
  const ROUNDS = [
    { name: "Legal", words: ["Plaintiff", "Defendant", "Litigation", "Tort", "Injunction", "Deposition", "Jurisdiction", "Precedent", "Indemnify"] },
    { name: "Healthcare", words: ["Diagnosis", "Prognosis", "Comorbidity", "Triage", "Contraindication", "Palliative", "Etiology", "Symptomatic", "Biopsy"] },
    { name: "Finance", words: ["Liquidity", "Amortization", "Collateral", "Arbitrage", "Hedge", "Equity", "Derivative", "Solvency", "Leverage"] }
  ];
  const OPENING_SHARED = 3; // shared words shown before any domain-specific word can appear

  let rounds = [], round = 0, shown = 0, order = [], placed = [];
  let phase = "play"; // play | revealed | done
  const results = [];

  const $ = id => document.getElementById(id);
  const stage = $("stage"), reveal = $("reveal"), nextBtn = $("nextBtn"), gotBtn = $("gotBtn"), count = $("count"), done = $("done");

  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  // ---- placement: spiral out from the centre, never overlap ----
  function overlaps(r, pad) {
    return placed.some(p => !(r.x + r.w + pad < p.x || p.x + p.w + pad < r.x || r.y + r.h + pad < p.y || p.y + p.h + pad < r.y));
  }
  function place(el) {
    const W = stage.clientWidth, H = stage.clientHeight;
    el.style.left = "0px"; el.style.top = "0px";
    const w = el.offsetWidth, h = el.offsetHeight, cx = W / 2, cy = H / 2;
    for (let a = 0; a < 1400; a += 0.22) {
      const r = 1.8 * a;
      const x = cx + r * Math.cos(a) * (W / H) - w / 2, y = cy + r * Math.sin(a) - h / 2;
      if (x < 8 || y < 8 || x + w > W - 8 || y + h > H - 8) { if (r > Math.max(W, H)) break; continue; }
      const rect = { x, y, w, h };
      if (!overlaps(rect, 10)) { placed.push(rect); el.style.left = x + "px"; el.style.top = y + "px"; return; }
    }
    const x = Math.random() * Math.max(1, W - w - 16) + 8, y = Math.random() * Math.max(1, H - h - 16) + 8;
    placed.push({ x, y, w, h }); el.style.left = x + "px"; el.style.top = y + "px";
  }
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { placed = []; stage.querySelectorAll(".word").forEach(place); }, 120); });

  function popWord(text) {
    stage.querySelectorAll(".word.new").forEach(w => w.classList.remove("new"));
    const el = document.createElement("span");
    el.className = "word new"; el.textContent = text;
    stage.insertBefore(el, reveal); place(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("in")));
  }

  // ---- round flow ----
  function buildOrder(R) {
    const shared = shuffle(SHARED.slice()), specific = shuffle(R.words.slice());
    const out = shared.splice(0, OPENING_SHARED);
    while (shared.length || specific.length) {
      if (specific.length) out.push(specific.shift());
      if (shared.length) out.push(shared.shift());
    }
    return out;
  }
  function setCount() {
    count.innerHTML = phase === "done" ? "Finished" : `Word ${shown}` + (shown >= order.length ? "<small>that's all of them</small>" : "");
  }
  function nextWord() {
    if (phase !== "play" || shown >= order.length) return;
    popWord(order[shown]); shown++;
    nextBtn.disabled = shown >= order.length;
    setCount();
  }
  function startRound() {
    phase = "play"; shown = 0; placed = []; order = buildOrder(rounds[round]);
    stage.querySelectorAll(".word").forEach(w => w.remove());
    reveal.classList.remove("on"); done.classList.add("hidden");
    nextBtn.disabled = false; gotBtn.disabled = false;
    gotBtn.innerHTML = "They've got it<kbd>Enter</kbd>";
    nextWord();
  }
  function gotIt() {
    if (phase === "play") {
      const R = rounds[round];
      phase = "revealed";
      results.push({ name: R.name, shown });
      $("revealName").textContent = R.name;
      $("revealNote").textContent = `Guessed after ${shown} ${shown === 1 ? "word" : "words"}.`;
      reveal.classList.add("on");
      nextBtn.disabled = true;
      gotBtn.innerHTML = (round < rounds.length - 1 ? "Continue" : "Finish") + "<kbd>Enter</kbd>";
    } else if (phase === "revealed") {
      round++;
      if (round < rounds.length) startRound(); else finish();
    }
  }
  function finish() {
    phase = "done";
    stage.querySelectorAll(".word").forEach(w => w.remove());
    reveal.classList.remove("on");
    $("rows").innerHTML = results.map(r => `<tr><td>${r.name}</td><td class="n">${r.shown}</td></tr>`).join("");
    done.classList.remove("hidden");
    nextBtn.disabled = true; gotBtn.disabled = true;
    setCount();
  }
  function restart() { rounds = shuffle(ROUNDS.slice()); round = 0; results.length = 0; startRound(); }

  nextBtn.addEventListener("click", nextWord);
  gotBtn.addEventListener("click", gotIt);
  $("restartBtn").addEventListener("click", restart);
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === " " || e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); nextWord(); }
    else if (e.key === "Enter") { e.preventDefault(); gotIt(); }
    else if (e.key === "r" || e.key === "R") { restart(); }
  });

  (document.fonts ? document.fonts.ready : Promise.resolve()).then(restart);
})();
</script>
